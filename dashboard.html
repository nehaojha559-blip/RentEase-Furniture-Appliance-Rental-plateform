<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RentEase - My Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-gray-900 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-blue-400">RentEase</a>
            <div class="space-x-6">
                <a href="index.html" class="hover:text-blue-400">Home</a>
                <a href="dashboard.html" class="text-blue-400 font-semibold">My Rentals</a>
                <a href="admin.html" class="hover:text-blue-400">Admin Panel</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-12 px-4">
        <h2 class="text-3xl font-bold mb-8 text-gray-800">My Active Rentals</h2>
        
        <!-- Active Rentals List -->
        <div id="rentalsList" class="space-y-6">
            <!-- JS yahan booked items render karega -->
            <p class="text-gray-500 text-center py-8 bg-white rounded-xl shadow-sm">You haven't rented anything yet. Go to Home to book an item!</p>
        </div>
    </main>

    <script>
        // LocalStorage se booked items nikalna
        const bookings = JSON.parse(localStorage.getItem('rentEaseBookings')) || [];
        const container = document.getElementById('rentalsList');

        if(bookings.length > 0) {
            container.innerHTML = ''; // Default text hatane ke liye
            
            bookings.forEach((item, index) => {
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center border border-gray-100">
                        <div class="flex items-center space-x-6 w-full md:w-2/3">
                            <img src="${item.img}" class="w-24 h-24 object-cover rounded-lg shadow-sm" alt="${item.name}">
                            <div>
                                <span class="text-xs font-bold text-blue-500 uppercase">${item.category}</span>
                                <h3 class="text-xl font-bold text-gray-800 mt-1">${item.name}</h3>
                                <p class="text-sm text-gray-500 mt-1">Tenure: <span class="font-semibold text-gray-700">${item.tenure}</span></p>
                                <p class="text-sm text-gray-500">Monthly Rent: <span class="font-semibold text-emerald-600">₹${item.rent}</span></p>
                            </div>
                        </div>
                        
                        <!-- Actions -->
                        <div class="mt-4 md:mt-0 flex flex-col space-y-2 w-full md:w-1/3 items-end">
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-semibold">Delivery Scheduled</span>
                            <button onclick="requestMaintenance('${item.name}')" class="text-sm border border-red-500 text-red-500 px-4 py-2 rounded-lg hover:bg-red-50 transition w-full md:w-auto text-center mt-2">
                                Request Maintenance
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Maintenance request handling
        function requestMaintenance(itemName) {
            alert(`Maintenance request raised for "${itemName}". Our service partner will visit within 24 hours.`);
        }
    </script>
</body>
</html>
